name: Resy auto-book

# GitHub Actions hard-caps every job at 6 hours, so "run forever" isn't
# literally possible. Instead we run resy.py's own --every loop for ~4h50m
# at a time and restart a fresh run every 5 hours, so coverage is continuous
# except for a small gap around each restart.
on:
  schedule:
    - cron: "0 */5 * * *"   # every 5 hours, UTC
  workflow_dispatch:
    inputs:
      days:
        description: "How many days ahead to scan"
        default: "30"
      every:
        description: "Seconds between checks"
        default: "30"

concurrency:
  group: resy-autobook
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  watch-and-book:
    runs-on: ubuntu-latest
    timeout-minutes: 290
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Log in to Resy
        env:
          RESY_TOKEN: ${{ secrets.RESY_TOKEN }}
        run: |
          TOKEN=$(printf '%s' "$RESY_TOKEN" | tr -d '[:space:]')
          python resy.py login --token "$TOKEN"

      # Loops on its own (--every) until it books one slot that fits
      # resy_config.toml's hours/money rules, or this step's timeout hits.
      # continue-on-error so a timeout doesn't skip the commit step below.
      - name: Scan and auto-book
        continue-on-error: true
        timeout-minutes: 280
        run: |
          python resy.py scan \
            --days "${{ github.event.inputs.days || '30' }}" \
            --every "${{ github.event.inputs.every || '30' }}" \
            --book --yes \
            --log resy_openings.csv

      - name: Save booking state and opening log back to the repo
        if: always()
        run: |
          git config user.name "resy-bot"
          git config user.email "actions@users.noreply.github.com"
          for f in resy_booked.json resy_openings.csv; do
            [ -f "$f" ] && git add "$f"
          done
          if ! git diff --cached --quiet; then
            git commit -m "Update booking state [skip ci]"
            git pull --rebase --autostash
            git push
          fi

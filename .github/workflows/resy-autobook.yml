name: Resy auto-book

# Scans in 15-minute blocks, so each block's log can be read soon after it
# ends. When a block runs its full 15 minutes, it starts the next block itself
# (GitHub's schedule is too unreliable to start runs every 15 minutes). The
# chain stops when a block ends early (a booking, an expired token, a crash),
# when a run is cancelled, or at night. The hourly schedule restarts it.
#
# Night: no scanning from midnight to 7am New York time for scheduled and
# chained blocks. A block that starts at night exits right away and doesn't
# start another; a block running up to midnight stops at midnight. The cron
# hours cover 7am-midnight in both EDT and EST; the New York-time check below
# handles the daylight-saving shift.
#
# Besides the schedule and the Actions tab, pushing a change to
# .github/triggers/scan.txt starts a block (and the chain after it). Blocks
# started that way or from the Actions tab ignore the night rule themselves.
on:
  schedule:
    # hourly at :17 (GitHub often drops runs scheduled on the hour), UTC, except 06-10 UTC
    - cron: "17 0-5,11-23 * * *"
  push:
    branches: [main]
    paths: [".github/triggers/scan.txt"]
  workflow_dispatch:
    inputs:
      days:
        description: "How many days ahead to scan"
        default: "30"
      every:
        description: "Seconds between checks (Resy blocks a machine that asks much more often)"
        default: "180"
      chain:
        description: "Set by the previous block when it starts this one; leave as false"
        default: "false"

# One block at a time; a newly queued block waits for the running one, and
# only the newest waiting block is kept.
concurrency:
  group: resy-autobook
  cancel-in-progress: false

permissions:
  contents: write
  actions: write

jobs:
  watch-and-book:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      # Write each line to the log right away; otherwise a cancelled run loses
      # everything the scan printed.
      PYTHONUNBUFFERED: "1"
      NIGHT_RULE: ${{ github.event_name == 'schedule' || github.event.inputs.chain == 'true' }}
      # Optional: lets resy.py email you if your token expires (HTTP 401/419).
      # Leave the secrets unset and it just skips sending, no error.
      ALERT_SMTP_USER: ${{ secrets.ALERT_SMTP_USER }}
      ALERT_SMTP_PASSWORD: ${{ secrets.ALERT_SMTP_PASSWORD }}
      ALERT_EMAIL_TO: ${{ secrets.ALERT_EMAIL_TO }}
    steps:
      - name: Skip the night (midnight-7am New York time)
        id: window
        if: env.NIGHT_RULE == 'true'
        run: |
          if [ "$(TZ=America/New_York date +%-H)" -lt 7 ]; then
            echo "It's $(TZ=America/New_York date +%H:%M) in New York - not scanning at night."
            echo "skip=true" >> "$GITHUB_OUTPUT"
          fi

      - uses: actions/checkout@v4
        if: steps.window.outputs.skip != 'true'

      - uses: actions/setup-python@v5
        if: steps.window.outputs.skip != 'true'
        with:
          python-version: "3.12"

      - name: Install dependencies
        if: steps.window.outputs.skip != 'true'
        run: pip install -r requirements.txt

      - name: Log in to Resy
        if: steps.window.outputs.skip != 'true'
        env:
          RESY_TOKEN: ${{ secrets.RESY_TOKEN }}
        run: |
          TOKEN=$(printf '%s' "$RESY_TOKEN" | tr -d '[:space:]')
          python resy.py login --token "$TOKEN"

      # Loops on its own (--every) until it books one slot that fits
      # resy_config.toml's hours/money rules, or the 15 minutes are up. It stops
      # early if Resy starts refusing every request (see BLOCKED_STOP in resy.py),
      # and then no next block starts.
      # Exit code 124 = ran the full block, which is what lets the next block start.
      # continue-on-error so running out of time doesn't skip the steps below.
      - name: Scan and auto-book (15 minutes)
        id: scan
        if: steps.window.outputs.skip != 'true'
        continue-on-error: true
        timeout-minutes: 20
        run: |
          mins=15
          if [ "$NIGHT_RULE" = "true" ]; then
            left=$(( ($(TZ=America/New_York date -d 'tomorrow 00:00' +%s) - $(date +%s)) / 60 ))
            [ "$left" -lt "$mins" ] && mins=$left
            [ "$mins" -lt 1 ] && mins=1
          fi
          echo "Scanning for up to $mins minutes."
          rc=0
          timeout -s INT "${mins}m" python resy.py scan \
            --days "${{ github.event.inputs.days || '30' }}" \
            --every "${{ github.event.inputs.every || '180' }}" \
            --book --yes \
            --log resy_openings.csv || rc=$?
          echo "rc=$rc" >> "$GITHUB_OUTPUT"
          exit $rc

      - name: Save booking state and opening log back to the repo
        if: always() && steps.window.outputs.skip != 'true'
        run: |
          git config user.name "resy-bot"
          git config user.email "actions@users.noreply.github.com"
          for f in resy_booked.json resy_openings.csv; do
            [ -f "$f" ] && git add "$f"
          done
          if ! git diff --cached --quiet; then
            git commit -m "Update booking state [skip ci]"
            git pull --rebase --autostash
            git push
          fi

      - name: Start the next 15-minute block
        if: ${{ !cancelled() && steps.scan.outputs.rc == '124' }}
        env:
          GH_TOKEN: ${{ github.token }}
          DAYS: ${{ github.event.inputs.days || '30' }}
          EVERY: ${{ github.event.inputs.every || '180' }}
        run: |
          gh workflow run resy-autobook.yml --repo "$GITHUB_REPOSITORY" --ref main \
            -f days="$DAYS" -f every="$EVERY" -f chain=true
